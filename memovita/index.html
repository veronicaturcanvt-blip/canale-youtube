<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memovita</title>
<meta name="description" content="Memovita: la tua vita, senza dimenticare niente. Scadenze, documenti e liste in un posto solo.">
<meta name="theme-color" content="#F4F3EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memovita">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3EF;--surface:#FFFFFF;--text:#17181C;--muted:#5B5E66;--line:#E4E3DD;--chip:#ECEBE6;--bell:#D92D20;--ink:#17181C;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141517;--surface:#202226;--text:#F2F2F0;--muted:#A9ACB3;--line:#33363B;--chip:#2C2F34;--ink:#F2F2F0;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#141517;--surface:#202226;--text:#F2F2F0;--muted:#A9ACB3;--line:#33363B;--chip:#2C2F34;--ink:#F2F2F0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Manrope,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2563EB;outline-offset:2px;border-radius:8px}
img{max-width:100%}
#app{max-width:480px;margin:0 auto;padding:20px 18px 120px}
h1,h2,h3,p{margin:0}

/* top */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
.top .date{font-size:14px;font-weight:600;color:var(--muted)}
.brand{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.slogan{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.bell{position:relative;width:50px;height:50px;border-radius:25px;border:none;background:var(--bell);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bell .badge{position:absolute;top:-3px;right:-3px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#fff;color:var(--bell);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bell)}

/* calendar card */
.calcard{position:relative;overflow:hidden;border-radius:22px;padding:16px;color:#17181C;margin-bottom:24px}
.calcard .head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.calcard .month{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.pillbtn{border:none;background:rgba(255,255,255,.78);color:#17181C;font-size:13px;font-weight:700;padding:8px 12px;border-radius:12px;display:flex;align-items:center;gap:4px}
.week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;background:rgba(255,255,255,.82);border-radius:12px;color:#17181C;min-height:58px}
.day .wd{font-size:10px;font-weight:700;color:#5B5E66}
.day .n{font-size:16px;font-weight:800}
.day.today{background:#1F2A22;color:#fff}.day.today .wd{color:#D7E2D5}
.dots{display:flex;gap:2px;height:6px}.dots i{width:6px;height:6px;border-radius:3px;display:block}
.day.today .dots i{box-shadow:0 0 0 1.5px #fff}
@keyframes mvFall{0%{transform:translateY(-40px) rotate(0);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translateY(420px) rotate(220deg);opacity:0}}
.fall{position:absolute;top:0;font-size:20px;pointer-events:none;animation:mvFall 9s linear infinite}
@media (prefers-reduced-motion: reduce){.fall{animation:none;top:10px;opacity:.45}}

/* sections */
.sec{margin-bottom:24px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sechead h2{font-size:18px;font-weight:800}
.link{border:none;background:none;padding:4px 0;font-size:13px;font-weight:700;color:var(--text);text-decoration:underline;text-underline-offset:3px}
.empty{background:var(--surface);border-radius:18px;padding:18px;font-size:14px;color:var(--muted);line-height:1.5}

/* colored rows */
.crow{width:100%;border:none;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;color:#fff;text-align:left;margin-bottom:8px}
.crow .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.crow .tx{display:flex;flex-direction:column;flex:1;min-width:0}
.crow .t{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .s{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-size:12px;font-weight:800;padding:5px 10px;border-radius:10px;background:#fff;color:#17181C;flex-shrink:0;white-space:nowrap}
.when.hot{background:var(--bell);color:#fff}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;border:none;border-radius:22px;padding:18px 16px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:#fff}
.tile .ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.tile .nm{font-size:17px;font-weight:800;line-height:1.2;word-break:break-word}
.tile .st{font-size:12px;font-weight:600}
.tbadge{position:absolute;top:14px;right:14px;height:28px;padding:0 9px;border-radius:14px;background:#fff;display:flex;align-items:center;gap:4px;color:var(--bell);font-size:13px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.newtile{grid-column:span 2;border:2px dashed var(--muted);background:transparent;border-radius:22px;height:64px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text);font-size:15px;font-weight:700;opacity:.85}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);height:52px;justify-content:center}
.nav button[aria-current="page"]{color:var(--text);font-weight:800}
.nav .plus{width:60px;height:60px;margin:-28px auto 0;border-radius:30px;border:4px solid var(--bg);background:var(--ink);color:var(--bg)}

/* inner pages */
.backbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.iconbtn{border:none;background:var(--surface);width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.txtbtn{border:none;background:var(--surface);height:44px;padding:0 16px;border-radius:22px;font-size:14px;font-weight:700;color:var(--text)}
.hero{border-radius:24px;padding:20px;color:#fff;margin-bottom:18px;display:flex;align-items:center;gap:14px}
.hero .ic{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero h1{font-size:26px;font-weight:800;line-height:1.15;word-break:break-word}
.hero p{font-size:14px;font-weight:600;margin-top:2px}
.list{background:var(--surface);border-radius:20px;overflow:hidden}
.row{width:100%;border:none;background:none;display:flex;align-items:center;gap:12px;padding:15px 16px;text-align:left;color:var(--text);border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-size:16px;font-weight:700;word-break:break-word}
.row .s{font-size:13px;color:var(--muted);font-weight:600}
.dot{width:12px;height:12px;border-radius:6px;flex-shrink:0}
.st-ok{background:#16A34A}.st-soon{background:#F59E0B}.st-late{background:var(--bell)}.st-none{background:var(--line)}
.addrow{width:100%;margin-top:10px;border:2px dashed var(--muted);background:transparent;border-radius:18px;height:54px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;color:var(--text);opacity:.85}

.next{border-radius:22px;padding:18px;color:#fff;margin-bottom:12px}
.next .lbl{font-size:13px;font-weight:700}
.next .big{font-size:28px;font-weight:800;line-height:1.15;margin:4px 0 2px}
.next .meta{font-size:15px;font-weight:700}
.next .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.wbtn{border:none;background:#fff;color:#17181C;height:42px;padding:0 14px;border-radius:21px;font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.gbtn{border:none;background:rgba(255,255,255,.22);color:#fff;height:42px;padding:0 14px;border-radius:21px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none}

.docbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.docbtn{position:relative;border:none;background:var(--surface);border-radius:18px;height:64px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800;color:var(--text);overflow:hidden}
.docbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumb{border:none;background:var(--surface);border-radius:14px;aspect-ratio:1;overflow:hidden;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pdf{font-size:12px;font-weight:700;padding:0 6px;text-align:center;word-break:break-word;line-height:1.25;max-height:3.75em;overflow:hidden}
.notes{width:100%;min-height:90px;border:none;background:var(--surface);border-radius:18px;padding:14px;font-size:15px;line-height:1.5;resize:vertical}

/* calendar page */
.calnav{display:flex;gap:6px}
.calnav button{border:none;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.8);color:#17181C;display:flex;align-items:center;justify-content:center}
.mgrid{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mgrid .wd{font-size:11px;font-weight:800;text-align:center;color:#3F4249;padding-bottom:4px}
.mday{border:none;aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.82);color:#17181C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:14px;font-weight:800}
.mday.out{visibility:hidden}
.mday.today{background:#1F2A22;color:#fff}
.mday.sel{box-shadow:inset 0 0 0 3px #17181C}
.mday.today.sel{box-shadow:inset 0 0 0 3px #fff}
.mday .dots i{width:5px;height:5px}

/* sheet */
.sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(10,10,12,.45)}
.sheet{position:relative;width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:21px;font-weight:800;margin-bottom:14px;padding-right:44px}
.sheet .x{position:absolute;top:14px;right:14px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:14px;font-weight:700}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:16px}
.fld textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;border:none;background:var(--ink);color:var(--bg);height:54px;border-radius:27px;font-size:16px;font-weight:800;margin-top:6px}
.danger{width:100%;border:none;background:none;color:var(--bell);height:48px;font-size:15px;font-weight:800;margin-top:6px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:40px;height:40px;border-radius:20px;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 0 0 0 3px var(--bg)}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.icn{border:2px solid var(--line);background:var(--surface);border-radius:14px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:var(--text)}
.icn[aria-pressed="true"]{border-color:var(--text);background:var(--chip)}
.choice{width:100%;border:none;border-radius:22px;padding:18px;display:flex;align-items:center;gap:14px;text-align:left;margin-bottom:12px}
.choice .t{font-size:17px;font-weight:800}
.choice .s{font-size:14px;font-weight:600;margin-top:2px;line-height:1.4}
.choice.man{background:var(--surface);color:var(--text)}
.choice.ai{background:#1D4ED8;color:#fff}
.soon{display:inline-block;font-size:11px;font-weight:800;background:#fff;color:#1D4ED8;padding:3px 8px;border-radius:8px;margin-left:6px;vertical-align:2px}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pick button{border:none;border-radius:18px;min-height:72px;padding:12px;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;gap:10px;text-align:left}
.viewer img{width:100%;border-radius:16px;display:block;margin-bottom:12px}
.pdfbox{background:var(--surface);border-radius:18px;padding:24px;text-align:center;margin-bottom:12px;font-weight:700;word-break:break-word}
.para{font-size:15px;line-height:1.55;color:var(--text);margin-bottom:12px}
.muted{color:var(--muted)}

/* search */
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:15px 16px;font-size:16px;margin-bottom:16px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:24px;font-size:14px;font-weight:700;z-index:60;max-width:90%;text-align:center}

/* onboarding */
.onb{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));overflow:auto}
.onb .in{max-width:440px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
.onb .art{flex:1;display:flex;align-items:center;justify-content:center;font-size:96px;min-height:180px}
.onb h1{font-size:30px;font-weight:800;line-height:1.15;margin-bottom:12px;letter-spacing:-.4px}
.onb p{font-size:16px;line-height:1.55;color:var(--muted);margin-bottom:10px}
.steps{display:flex;gap:6px;margin:18px 0}
.steps i{height:6px;flex:1;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--text)}
.fld[hidden]{display:none}
.rempick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rempick .dp{height:44px;font-size:13px}
.switch{width:52px;height:32px;border-radius:16px;border:none;background:var(--line);position:relative;flex-shrink:0;padding:0}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.switch[aria-checked="true"]{background:#16A34A}
.switch[aria-checked="true"] i{left:23px}
.ph{font-size:16px;font-weight:800;margin:14px 0 4px}
.topbtns{display:flex;gap:10px;align-items:center;flex-shrink:0}
.sbtn{width:50px;height:50px;border-radius:25px;border:none;background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lchips{display:flex;flex-wrap:wrap;gap:8px}
.lchip{border:2px solid var(--c,var(--line));background:var(--surface);color:var(--text);height:44px;padding:0 14px;border-radius:22px;font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.lchip[aria-pressed="true"]{background:var(--c);color:#fff}
.lchip.add{border:2px dashed var(--muted);opacity:.85}
.lnum{min-width:22px;height:22px;border-radius:11px;background:rgba(0,0,0,.18);font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.lchip[aria-pressed="false"] .lnum{background:var(--chip)}
.addform{display:flex;gap:10px;margin-bottom:22px}
.addform input{flex:1;min-width:0}
.addbtn{width:54px;height:54px;border-radius:18px;border:none;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.uchips{display:flex;flex-wrap:wrap;gap:8px}
.uchip{border:none;background:var(--surface);color:var(--text);height:42px;padding:0 14px;border-radius:21px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.dept{font-size:13px;font-weight:800;color:var(--muted);margin:4px 4px 6px}
.irow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:none}
.icheck{flex:1;min-width:0;border:none;background:none;display:flex;align-items:center;gap:12px;padding:14px 8px 14px 16px;text-align:left;color:var(--text);font-size:16px;font-weight:600}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.irow.done .box{background:#16A34A;border-color:#16A34A;color:#fff}
.irow.done .iname{text-decoration:line-through;color:var(--muted)}
.iname{word-break:break-word}
.ibtn{border:none;background:none;width:44px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.ibtn.on{color:#D97706}
.ibtn.bellon{color:#4338CA}
.twhen{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.twhen.hot{color:var(--bell)}
.todoq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.todoq .dp{height:44px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px}
.two .fld[hidden]+.fld{grid-column:span 2}
.daypick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dp{border:2px solid var(--line);background:var(--surface);border-radius:12px;height:46px;font-size:13px;font-weight:800;color:var(--text);padding:0}
.dp[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ring{position:relative;width:260px;height:260px;flex-shrink:0}
.orbit{position:absolute;inset:0;animation:mvSpin 70s linear infinite}
.orb{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:25px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.orb .up{display:flex;animation:mvSpin 70s linear infinite reverse}
@keyframes mvSpin{to{transform:rotate(360deg)}}
.cpage{position:absolute;left:50%;top:50%;width:96px;margin:-54px 0 0 -48px;background:#fff;border-radius:18px;overflow:hidden;text-align:center;color:#17181C;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cpage .pm{font-size:14px;font-weight:800;padding:7px 0}
.cpage .pd{font-size:46px;font-weight:800;line-height:1;padding-top:6px}
.cpage .pw{font-size:12px;font-weight:700;color:#5B5E66;padding:4px 0 9px}
@media (prefers-reduced-motion: reduce){.orbit,.orb .up{animation:none}}
.ghost{width:100%;border:none;background:none;height:48px;font-size:15px;font-weight:700;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="nav" aria-label="Navigazione principale"><div class="in" id="navin"></div></nav>
<div id="layer"></div>

<script>

/* ---------- utilità ---------- */
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){const a=String(s).split('-').map(Number);return new Date(a[0],(a[1]||1)-1,a[2]||1);}
function today(){return iso(new Date());}
function diff(s){return Math.round((parse(s)-parse(today()))/86400000);}
function fmtShort(s){const d=parse(s);return d.getDate()+' '+MESIb[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');}
function fmtLong(s){const d=parse(s);return GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()].toLowerCase()+' '+d.getFullYear();}
function money(n){if(n===''||n==null||isNaN(n))return '';try{return Number(n).toLocaleString('it-IT',{style:'currency',currency:'EUR'});}catch(e){return Number(n).toFixed(2)+' €';}}
function addMonths(d,n){const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d;}
const WDL=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
function wdn(d){return (d.getDay()+6)%7+1;}
function nextDate(s,rep,days){const d=parse(s);if(rep==='settimanale'){if(days&&days.length){for(let i=0;i<7;i++){d.setDate(d.getDate()+1);if(days.indexOf(wdn(d))>=0)return iso(d);}return iso(d);}d.setDate(d.getDate()+7);return iso(d);}const m={mensile:1,bimestrale:2,trimestrale:3,semestrale:6,annuale:12,biennale:24}[rep];return m?iso(addMonths(d,m)):null;}
function repLabel(e){if(e.repeat==='settimanale'&&e.days&&e.days.length)return 'Ogni '+e.days.slice().sort((a,b)=>a-b).map(n=>WDL[n-1]).join(', ');return (RIPETI.find(r=>r[0]===e.repeat)||['',''])[1];}
function rel(s){const n=diff(s);if(n<0)return n===-1?'scaduta ieri':'scaduta da '+(-n)+' gg';if(n===0)return 'oggi';if(n===1)return 'domani';if(n<=31)return 'tra '+n+' gg';if(n<=60)return 'tra '+Math.round(n/7)+' settimane';if(n<=400)return 'tra '+Math.round(n/30.4)+' mesi';return fmtShort(s);}
function remsOf(e){if(Array.isArray(e.rems))return e.rems;if(e.rem)return [e.rem];return (S.settings.rems||DEF_REMS);}
function remLabel(n){const r=PREAVVISI.find(x=>x[0]===n);return r?r[1]:n+' giorni';}
/* stadio attuale: l'avviso più recente già scattato (0 = oggi o scaduta) */
function stage(e){const d=diff(e.date);if(d<=0)return 0;const passed=remsOf(e).filter(t=>d<=t);return passed.length?Math.min.apply(null,passed):null;}
function isHot(e){const st=stage(e);if(st===null)return false;if(st===0)return true;return e.ack!==st;}
function stageText(e){const st=stage(e);if(st===null||st===0)return '';return 'Avviso '+remLabel(st)+' prima';}

function allOpen(){
  const out=[];
  S.areas.forEach(a=>a.subs.forEach(s=>s.entries.forEach(e=>{if(!e.done)out.push({a,s,e});})));
  return out.sort((x,y)=>x.e.date.localeCompare(y.e.date));
}

/* ---------- da fare ---------- */
const TODO_COLOR='#4338CA';
function todoAt(t){if(!t.remDate)return null;const d=parse(t.remDate);const tm=(t.remTime||'09:00').split(':');d.setHours(+tm[0]||0,+tm[1]||0,0,0);return d;}
function todoHot(t){const d=todoAt(t);return !t.done&&!!d&&Date.now()>=d.getTime();}
function todoHotList(){return (S.todos||[]).filter(todoHot);}
function totalHot(){return hotList().length+todoHotList().length;}
function todoWhen(t){if(!t.remDate)return '';const n=diff(t.remDate);const day=n===0?'oggi':n===1?'domani':n===-1?'ieri':fmtShort(t.remDate);return day+(t.remTime?' alle '+t.remTime:'');}
function quickRem(kind){const now=new Date();if(kind==='oggi'){let h=now.getHours()<17?18:Math.min(now.getHours()+1,23);return {remDate:today(),remTime:String(h).padStart(2,'0')+':00'};}
  if(kind==='domani'){const d=new Date();d.setDate(d.getDate()+1);return {remDate:iso(d),remTime:'09:00'};}return {remDate:'',remTime:''};}
let todoQuick='';
function subStatus(s){
  const open=s.entries.filter(e=>!e.done).sort((x,y)=>x.date.localeCompare(y.date));
  if(!open.length)return {cls:'st-none',txt:s.entries.length?'Tutto fatto':'Vuota',next:null};
  const e=open[0],n=diff(e.date);
  if(n<0)return {cls:'st-late',txt:rel(e.date),next:e};
  if(isHot(e))return {cls:'st-soon',txt:rel(e.date),next:e};
  return {cls:'st-ok',txt:'Prossima: '+fmtShort(e.date),next:e};
}
function areaStatus(a){
  const open=[];a.subs.forEach(s=>s.entries.forEach(e=>{if(!e.done)open.push({s,e});}));
  open.sort((x,y)=>x.e.date.localeCompare(y.e.date));
  const hot=open.filter(o=>isHot(o.e));
  if(hot.length===1)return {hot:1,txt:hot[0].e.title+' '+rel(hot[0].e.date)};
  if(hot.length>1)return {hot:hot.length,txt:hot.length+' in scadenza'};
  if(open.length)return {hot:0,txt:'Prossima: '+fmtShort(open[0].e.date)};
  return {hot:0,txt:a.subs.some(s=>s.entries.length||s.files.length)?'Tutto in ordine':'Da compilare'};
}
function dotsFor(dateStr){
  const c=[];S.areas.forEach(a=>a.subs.forEach(s=>s.entries.forEach(e=>{if(!e.done&&e.date===dateStr&&c.indexOf(a.color)<0)c.push(a.color);})));
  if((S.todos||[]).some(t=>!t.done&&t.remDate===dateStr)&&c.indexOf(TODO_COLOR)<0)c.push(TODO_COLOR);
  return c.slice(0,3);
}

/* ---------- file (IndexedDB) ---------- */
const mem={};let dbp=null;
function idb(){if(!dbp){dbp=new Promise(res=>{try{const r=indexedDB.open('memovita',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});}return dbp;}
async function fput(id,data){const db=await idb();if(!db){mem[id]=data;return;}await new Promise(r=>{try{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(data,id);tx.oncomplete=()=>r();tx.onerror=()=>{mem[id]=data;r();};}catch(e){mem[id]=data;r();}});}
async function fget(id){if(mem[id])return mem[id];const db=await idb();if(!db)return null;return new Promise(r=>{try{const q=db.transaction('files').objectStore('files').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null);}catch(e){r(null);}});}
async function fdel(id){delete mem[id];const db=await idb();if(!db)return;await new Promise(r=>{try{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>r();tx.onerror=()=>r();}catch(e){r();}});}
function readAsDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f);});}
function shrinkImage(dataURL){return new Promise(res=>{const img=new Image();img.onload=()=>{const max=1600;let w=img.width,h=img.height;if(w<=max&&h<=max){res(dataURL);return;}const k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);try{res(c.toDataURL('image/jpeg',0.85));}catch(e){res(dataURL);}};img.onerror=()=>res(dataURL);img.src=dataURL;});}
function dataURLtoBlob(u){const i=u.indexOf(',');const meta=u.slice(5,i);const bin=atob(u.slice(i+1));const arr=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);return new Blob([arr],{type:meta.split(';')[0]});}

/* ---------- capacità (salvataggio file) ---------- */
let DL=null;
try{if(window.claude&&typeof window.claude.use==='function'){window.claude.use('downloads').then(x=>{DL=x;rerenderSheetHooks();}).catch(()=>{});}}catch(e){}
function rerenderSheetHooks(){}
async function saveFile(filename,data){
  if(!DL){
    try{const blob=data instanceof Blob?data:new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);toast('File pronto');}
    catch(e){toast('Salvataggio non riuscito. Riprova');}
    return;
  }
  try{await DL.save({filename,data});toast('File pronto');}
  catch(err){const c=err&&err.code;if(c==='declined')return;if(c==='rate_limited'){toast('Attendi un attimo e riprova');return;}toast('Salvataggio non disponibile qui');}
}

/* ---------- navigazione ---------- */
let V={name:'home'};const stack=[];
let calView=null,calSel=today(),query='';
function go(v){stack.push(V);V=v;render();window.scrollTo(0,0);}
function back(){V=stack.pop()||{name:'home'};render();window.scrollTo(0,0);}
function tab(name){stack.length=0;V={name};render();window.scrollTo(0,0);}

/* ---------- render ---------- */
const app=document.getElementById('app');
function render(){
  if(V.name==='home')app.innerHTML=vHome();
  else if(V.name==='area')app.innerHTML=vArea();
  else if(V.name==='sub')app.innerHTML=vSub();
  else if(V.name==='calendar')app.innerHTML=vCal();
  else if(V.name==='search')app.innerHTML=vSearch();
  else if(V.name==='alerts')app.innerHTML=vAlerts();
  else if(V.name==='profile')app.innerHTML=vProfile();
  else if(V.name==='shop')app.innerHTML=vShop();
  else if(V.name==='todo')app.innerHTML=vTodo();

function gcalURL(a,s,e){

      (e.notes?'<p style="margin-top:10px;font-size:14px;line-height:1.45">'+esc(e.notes)+'</p>':'')+

function vCal(){
  const now=new Date();if(!calView)calView={y:now.getFullYear(),m:now.getMonth()};
  const t=TEMI[calView.m];
  const first=new Date(calView.y,calView.m,1);const lead=(first.getDay()+6)%7;const days=new Date(calView.y,calView.m+1,0).getDate();
  let g=WD.map(w=>'<span class="wd">'+w.charAt(0)+w.slice(1).toLowerCase()+'</span>').join('');
  for(let i=0;i<lead;i++)g+='<span class="mday out"></span>';
  for(let d=1;d<=days;d++){const s=iso(new Date(calView.y,calView.m,d));g+='<button class="mday'+(s===today()?' today':'')+(s===calSel?' sel':'')+'" data-act="selday" data-d="'+s+'" aria-label="'+esc(fmtLong(s))+'">'+d+dotsHTML(dotsFor(s))+'</button>';}

  const list=(items.length||dayTodos.length)?dayTodos.map(todoRow).join('')+items.map(o=>o.e.done?'<div class="row" style="background:var(--surface);border-radius:18px;margin-bottom:8px"><span class="dot st-ok"></span><span class="tx"><span class="t">'+esc(o.e.title)+'</span><span class="s">'+esc(o.a.name+' · fatto')+'</span></span></div>':crow(o)).join(''):'<div class="empty">Nessuna scadenza in questo giorno.</div>';

    '<section class="sec"><div class="sechead"><h2 style="text-transform:none">'+esc(fmtLong(calSel).replace(/^./,c=>c.toUpperCase()))+'</h2></div>'+list+'</section>';
}

function vSearch(){return '<div class="backbar"><button class="iconbtn" data-act="back" aria-label="Indietro">'+I.back(22)+'</button><span></span></div><h1 style="font-size:26px;font-weight:800;margin-bottom:14px">Cerca</h1><input id="q" class="search" type="search" placeholder="Es. garanzia lavatrice, bollo, palestra" value="'+esc(query)+'" aria-label="Cerca"><div id="res">'+searchResults()+'</div>';}
function searchResults(){
  const q=query.trim().toLowerCase();if(!q)return '<div class="empty">Cerca tra riquadri, sottovoci, scadenze, note, nomi dei documenti e liste della spesa.</div>';
  const out=[];
  S.areas.forEach(a=>a.subs.forEach(s=>{
    const hay=[a.name,s.name,s.notes].concat(s.entries.map(e=>e.title+' '+(e.notes||''))).concat(s.files.map(f=>f.name)).join(' ').toLowerCase();
    if(hay.indexOf(q)>=0){const st=subStatus(s);out.push('<button class="row" data-act="sub" data-a="'+a.id+'" data-s="'+s.id+'"><span class="dot" style="background:'+a.color+'"></span><span class="tx"><span class="t">'+esc(s.name)+'</span><span class="s">'+esc(a.name+' · '+st.txt)+'</span></span>'+I.next(20)+'</button>');}
  }));
  (S.todos||[]).forEach(t=>{if(t.text.toLowerCase().indexOf(q)>=0)out.push('<button class="row" data-act="tab" data-v="todo"><span class="dot" style="background:'+TODO_COLOR+'"></span><span class="tx"><span class="t">'+esc(t.text)+'</span><span class="s">'+esc('Da fare'+(t.done?' · fatto':t.remDate?' · '+todoWhen(t):''))+'</span></span>'+I.next(20)+'</button>');});
  (S.lists||[]).forEach(l=>{const hits=l.items.filter(it=>it.name.toLowerCase().indexOf(q)>=0);if(hits.length||l.name.toLowerCase().indexOf(q)>=0)out.push('<button class="row" data-act="openlist" data-l="'+l.id+'"><span class="dot" style="background:'+l.color+'"></span><span class="tx"><span class="t">'+esc(hits.length?hits.map(h=>h.name).join(', '):l.name)+'</span><span class="s">'+esc('Spesa · '+l.name)+'</span></span>'+I.next(20)+'</button>');});
  return out.length?'<div class="list">'+out.join('')+'</div>':'<div class="empty">Nessun risultato per "'+esc(query)+'".</div>';
}

  const data=await fget(f.id);
  const body=(f.type==='img'?(data?'<div class="viewer"><img src="'+data+'" alt="'+esc(f.name)+'"></div>':'<div class="pdfbox">Immagine non trovata su questo dispositivo.</div>'):'<div class="pdfbox">'+I.pdf(40)+'<br>'+esc(f.name)+'</div>')+
    '<div class="fld"><label for="fname">Nome</label><input id="fname" maxlength="60" value="'+esc(f.name)+'"></div>'+
    '<button class="primary" data-act="renfile" data-f="'+f.id+'">Salva nome</button>'+
    (data?'<button class="primary" data-act="savefile" data-f="'+f.id+'" data-needs-dl style="background:var(--surface);color:var(--text)">'+(f.type==='img'?'Salva sul telefono':'Apri o condividi PDF')+'</button>':'')+
    '<button class="danger" data-act="delfile" data-f="'+f.id+'">Elimina</button>';
  sheet(f.type==='img'?'Foto':'Documento PDF',body);
}

/* ---------- onboarding ---------- */
let onbStep=0;
const ONB=[
  {art:'ring',t:'Tutta la tua vita pratica, in un posto solo',p:['Bollette, bollo, palestra, visite, scuola: ogni area ha il suo riquadro colorato.','Quando qualcosa sta per scadere, compare il campanello rosso.']},
  {art:'🔒',t:'I tuoi documenti restano tuoi',p:['Tutti i dati restano solo su questo telefono. Nessuno li vede, nemmeno noi. Niente pubblicità, niente vendita di dati.','Puoi esportare un backup o cancellare tutto quando vuoi dal Profilo.']},
  {art:'✨',t:'Con la scansione IA è tutto più facile',p:['Presto potrai fotografare un documento: l\'app legge importo e scadenza e lo mette da sola nella casella giusta.','Intanto puoi inserire tutto a mano e allegare PDF e foto.']}
];
function showOnboarding(){
  if(document.querySelector('.onb'))return renderOnb();
  const d=document.createElement('div');d.className='onb';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','Benvenuto in Memovita');document.body.appendChild(d);renderOnb();
}
function renderOnb(){
  const d=document.querySelector('.onb');if(!d)return;const s=ONB[onbStep];
  d.innerHTML='<div class="in"><div class="art" aria-hidden="true">'+(s.art==='ring'?ringHTML():s.art)+'</div><div class="steps" aria-hidden="true">'+ONB.map((x,i)=>'<i class="'+(i<=onbStep?'on':'')+'"></i>').join('')+'</div><h1>'+esc(s.t)+'</h1>'+s.p.map(x=>'<p>'+esc(x)+'</p>').join('')+
    '<button class="primary" style="margin-top:18px" data-act="onbnext">'+(onbStep<ONB.length-1?'Avanti':'Inizia')+'</button>'+(onbStep<ONB.length-1?'<button class="ghost" data-act="onbskip">Salta</button>':'')+'</div>';
  const b=d.querySelector('.primary');if(b)b.focus();
}
function ringHTML(){
  const now=new Date();const t=TEMI[now.getMonth()];const list=S.areas.filter(a=>!a.hidden).slice(0,10);const n=list.length||1;const R=100;
  let h='<div class="ring"><div class="orbit">';
  list.forEach((a,i)=>{const ang=(i/n)*2*Math.PI-Math.PI/2;h+='<span class="orb" style="background:'+a.color+';transform:translate('+(Math.cos(ang)*R).toFixed(1)+'px,'+(Math.sin(ang)*R).toFixed(1)+'px)"><span class="up">'+svg(a.icon,22)+'</span></span>';});
  h+='</div><div class="cpage"><div class="pm" style="background:'+t.bg+'">'+MESI[now.getMonth()]+'</div><div class="pd">'+now.getDate()+'</div><div class="pw">'+GIORNI[now.getDay()]+'</div></div></div>';
  return h;
}
function endOnb(){S.onboarded=true;save();const d=document.querySelector('.onb');if(d)d.remove();onbStep=0;}

/* ---------- azioni ---------- */
const val=id=>{const el=document.getElementById(id);return el?el.value:'';};
const A={
  tab:d=>{if(d.v==='calendar'){calView=null;calSel=today();}tab(d.v);},
  back:()=>back(),
  close:()=>close(),
  area:d=>go({name:'area',aid:d.a}),
  sub:d=>go({name:'sub',aid:d.a,sid:d.s}),
  openday:d=>{const p=parse(d.d);calView={y:p.getFullYear(),m:p.getMonth()};calSel=d.d;stack.length=0;V={name:'calendar'};render();window.scrollTo(0,0);},
  selday:d=>{calSel=d.d;render();},
  mprev:()=>{calView.m--;if(calView.m<0){calView.m=11;calView.y--;}render();},
  mnext:()=>{calView.m++;if(calView.m>11){calView.m=0;calView.y++;}render();},
  add:()=>addSheet(),
  aiinfo:()=>sheet('Scansione IA','<p class="para">Arriva nella prossima versione. Fotografi o carichi un documento (bolletta, polizza, scontrino) e l\'app riconosce cosa è, legge importo e scadenza e lo mette da sola nel riquadro giusto. Prima di salvare vedi sempre il riepilogo e puoi correggerlo.</p><p class="para muted">Per ora puoi inserire la scadenza a mano e allegare la foto del documento nella sottovoce.</p><button class="primary" data-act="manual">Inserisci a mano</button>'),
  manual:()=>pickArea(),
  pickarea:d=>pickSub(findArea(d.a)),
  picksub:d=>entryForm(d.a,d.s,null),
  newarea:()=>areaForm(null),
  editarea:d=>areaForm(findArea(d.a)),
  pickc:(d,el)=>{draft.color=d.c;layer.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));},
  picki:(d,el)=>{draft.icon=d.i;layer.querySelectorAll('.icn').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));},
  savearea:d=>{const n=val('fname').trim();if(!n){toast('Scrivi un nome per il riquadro');return;}
    if(d.a){const a=findArea(d.a);a.name=n;a.color=draft.color;a.icon=draft.icon;const sw=document.getElementById('fvis');if(sw){const h=sw.getAttribute('aria-checked')!=='true';if(h&&S.areas.filter(x=>!x.hidden&&x.id!==a.id).length===0){toast('Almeno un riquadro deve restare visibile');return;}a.hidden=h;}toast('Riquadro salvato');}
    else{S.areas.push({id:uid(),name:n,color:draft.color,icon:draft.icon,subs:[]});toast('Riquadro creato');}
    save();close();render();},
  delarea:d=>{const a=findArea(d.a);sheet('Eliminare "'+a.name+'"?','<p class="para">Spariscono anche tutte le sottovoci, le scadenze e i documenti dentro questo riquadro.</p><button class="primary" style="background:var(--bell);color:#fff" data-act="delarea2" data-a="'+a.id+'">Elimina riquadro</button><button class="ghost" data-act="close">Annulla</button>');},
  delarea2:async d=>{const a=findArea(d.a);if(!a)return;for(const s of a.subs)for(const f of s.files)await fdel(f.id);S.areas=S.areas.filter(x=>x.id!==d.a);save();close();tab('home');toast('Riquadro eliminato');},
  newsub:(d,el)=>{const a=findArea(d.a);subForm(a,null);if(el&&el.dataset.then)draft.then='entry';else draft.then=null;},
  editsub:d=>subForm(findArea(d.a),findSub(d.a,d.s)),
  savesub:d=>{const n=val('fname').trim();if(!n){toast('Scrivi un nome');return;}const a=findArea(d.a);
    if(d.s){findSub(d.a,d.s).name=n;save();close();render();toast('Salvato');return;}
    const s={id:uid(),name:n,entries:[],files:[],notes:''};a.subs.push(s);save();render();
    if(draft.then==='entry'){draft.then=null;entryForm(a.id,s.id,null);}else{close();toast('Sottovoce creata');}},
  delsub:d=>{const s=findSub(d.a,d.s);sheet('Eliminare "'+s.name+'"?','<p class="para">Spariscono anche le scadenze e i documenti di questa sottovoce.</p><button class="primary" style="background:var(--bell);color:#fff" data-act="delsub2" data-a="'+d.a+'" data-s="'+d.s+'">Elimina sottovoce</button><button class="ghost" data-act="close">Annulla</button>');},
  delsub2:async d=>{const a=findArea(d.a),s=findSub(d.a,d.s);if(!s)return;for(const f of s.files)await fdel(f.id);a.subs=a.subs.filter(x=>x.id!==d.s);save();close();if(V.name==='sub')back();else render();toast('Sottovoce eliminata');},
  toggleswitch:(d,el)=>{el.setAttribute('aria-checked',String(el.getAttribute('aria-checked')!=='true'));},
  pickday:(d,el)=>{el.setAttribute('aria-pressed',String(el.getAttribute('aria-pressed')!=='true'));},
  newentry:()=>entryForm(V.aid,V.sid,null),
  editentry:d=>{const s=findSub(V.aid,V.sid);entryForm(V.aid,V.sid,s.entries.find(e=>e.id===d.e));},
  saveentry:d=>{const s=findSub(d.a,d.s);const title=val('ftitle').trim()||s.name;const rp=val('frep');const date=rp==='settimanale'?today():val('fdate');if(!date){toast('Scegli una data');return;}
    const am=val('famount');const o={title,date,amount:am===''?'':Math.round(parseFloat(am.replace(',','.'))*100)/100,repeat:val('frep'),rems:Array.from(layer.querySelectorAll('.dp[data-r][aria-pressed="true"]')).map(b=>+b.dataset.r).sort((a,b)=>b-a),notes:val('fnotes').trim()};
    if(o.amount!==''&&isNaN(o.amount))o.amount='';
    if(o.repeat==='settimanale'){let ds=Array.from(layer.querySelectorAll('.dp[data-n][aria-pressed="true"]')).map(b=>+b.dataset.n);if(!ds.length)ds=[wdn(parse(o.date))];o.days=ds.sort((a,b)=>a-b);const dd=parse(o.date);for(let i=0;i<7&&o.days.indexOf(wdn(dd))<0;i++)dd.setDate(dd.getDate()+1);o.date=iso(dd);}else{o.days=[];}
    if(d.e){const ex=s.entries.find(e=>e.id===d.e);Object.assign(ex,o);delete ex.ack;delete ex.rem;toast('Scadenza salvata');}
    else{s.entries.push(Object.assign({id:uid(),done:false},o));toast('Scadenza aggiunta');}
    save();close();if(V.name!=='sub'||V.sid!==d.s){go({name:'sub',aid:d.a,sid:d.s});}else render();},
  delentry:d=>{const s=findSub(d.a,d.s);s.entries=s.entries.filter(e=>e.id!==d.e);save();close();render();toast('Scadenza eliminata');},
  done:d=>{const s=findSub(V.aid,V.sid);const e=s.entries.find(x=>x.id===d.e);if(!e)return;e.done=true;e.doneAt=today();
    let msg=e.amount?'Segnato come pagato':'Segnato come fatto';
    if(e.repeat){const nd=nextDate(e.date,e.repeat,e.days);if(nd){s.entries.push({id:uid(),title:e.title,date:nd,amount:e.amount,repeat:e.repeat,days:e.days||[],rems:remsOf(e).slice(),notes:e.notes,done:false});msg+='. Prossima: '+fmtShort(nd);}}
    save();render();toast(msg);},
  savedefrems:()=>{S.settings.rems=Array.from(document.querySelectorAll('#defrems .dp[aria-pressed="true"]')).map(b=>+b.dataset.r).sort((a,b)=>b-a);save();toast('Avvisi predefiniti salvati');},
  togglearea:d=>{const a=findArea(d.a);if(!a)return;const vis=S.areas.filter(x=>!x.hidden).length;if(!a.hidden&&vis<=1){toast('Almeno un riquadro deve restare visibile');return;}a.hidden=!a.hidden;save();render();toast(a.hidden?a.name+' nascosto':a.name+' di nuovo in Home');},
  openlist:d=>{shopSel=d.l;if(V.name!=='shop'){stack.length=0;V={name:'shop'};}render();window.scrollTo(0,0);},
  newlist:()=>listForm(null),
  editlist:d=>listForm(findList(d.l)),
  savelist:d=>{const n=val('fname').trim();if(!n){toast('Scrivi un nome per la lista');return;}
    if(d.l){const l=findList(d.l);l.name=n;l.color=draft.color;toast('Lista salvata');}
    else{const l={id:uid(),name:cap(n),color:draft.color,items:[],usual:[]};S.lists.push(l);shopSel=l.id;toast('Lista creata');}
    save();close();render();},
  dellist:d=>{const l=findList(d.l);sheet('Eliminare "'+l.name+'"?','<p class="para">Spariscono gli articoli e i soliti di questa lista.</p><button class="primary" style="background:var(--bell);color:#fff" data-act="dellist2" data-l="'+l.id+'">Elimina lista</button><button class="ghost" data-act="close">Annulla</button>');},
  dellist2:d=>{S.lists=S.lists.filter(x=>x.id!==d.l);shopSel=null;save();close();render();toast('Lista eliminata');},
  addusual:d=>{addItem(d.u);},
  toggleitem:d=>{const i=findItem(d.i);if(!i)return;i.done=!i.done;save();render();},
  staritem:d=>{const i=findItem(d.i);const l=curList();if(!i)return;const k=l.usual.findIndex(u=>u.toLowerCase()===i.name.toLowerCase());if(k>=0){l.usual.splice(k,1);toast(i.name+' tolto dai soliti');}else{l.usual.push(i.name);toast(i.name+' aggiunto ai soliti');}save();render();},
  edititem:d=>{const i=findItem(d.i);if(i)itemForm(i);},
  saveitem:d=>{const i=findItem(d.i);const l=curList();if(!i)return;const n=cap(val('iname'));if(!n.trim()){toast('Scrivi il nome');return;}
    const old=i.name;i.name=n;i.qty=val('iqty').trim();i.dept=val('idept');
    const want=document.getElementById('iusual').getAttribute('aria-checked')==='true';
    l.usual=l.usual.filter(u=>u.toLowerCase()!==old.toLowerCase()&&u.toLowerCase()!==n.toLowerCase());if(want)l.usual.push(n);
    save();close();render();toast('Salvato');},
  delitem:d=>{const l=curList();l.items=l.items.filter(i=>i.id!==d.i);save();close();render();toast('Articolo eliminato');},
  cleardone:()=>{const l=curList();const n=l.items.filter(i=>i.done).length;l.items=l.items.filter(i=>!i.done);save();render();toast(n+(n===1?' articolo tolto':' articoli tolti'));},
  todoquick:d=>{todoQuick=d.q;render();const n=document.getElementById('newtodo');if(n)n.focus();},
  toggletodo1:d=>{const t=findTodo(d.t);if(!t)return;t.done=!t.done;t.doneAt=t.done?today():undefined;save();render();},
  edittodo:d=>{const t=findTodo(d.t);if(t)todoForm(t);},
  todoset:d=>{const r=quickRem(d.q);document.getElementById('tdate').value=r.remDate;document.getElementById('ttime').value=r.remTime;},
  savetodo:d=>{const t=findTodo(d.t);if(!t)return;const txt=val('ttext').trim();if(!txt){toast('Scrivi qualcosa');return;}t.text=cap(txt);t.remDate=val('tdate');t.remTime=t.remDate?(val('ttime')||'09:00'):'';save();close();render();toast(t.remDate?'Te lo ricordo '+todoWhen(t):'Salvato');},
  deltodo:d=>{S.todos=S.todos.filter(t=>t.id!==d.t);save();close();render();toast('Eliminato');},
  cleartodo:()=>{const n=S.todos.filter(t=>t.done).length;S.todos=S.todos.filter(t=>!t.done);save();render();toast(n+(n===1?' tolto':' tolti'));},
  toggletodo:()=>{S.settings.todoHidden=!S.settings.todoHidden;save();render();toast(S.settings.todoHidden?'Da fare nascosto':'Da fare di nuovo in Home');},
  ack:d=>{const s=findSub(d.a||V.aid,d.s||V.sid);const e=s&&s.entries.find(x=>x.id===d.e);if(!e)return;e.ack=stage(e);save();render();toast('Ok, ti riavviso più vicino alla scadenza');},
  undo:d=>{const s=findSub(V.aid,V.sid);const e=s.entries.find(x=>x.id===d.e);if(e){e.done=false;delete e.doneAt;save();render();toast('Scadenza riaperta');}},
  file:d=>{const s=findSub(V.aid,V.sid);const f=s.files.find(x=>x.id===d.f);if(f)fileSheet(f);},
  renfile:d=>{const s=findSub(V.aid,V.sid);const f=s.files.find(x=>x.id===d.f);const n=val('fname').trim();if(f&&n){f.name=n;save();close();render();toast('Nome salvato');}},
  savefile:async d=>{const s=findSub(V.aid,V.sid);const f=s.files.find(x=>x.id===d.f);const data=await fget(d.f);if(!f||!data)return;
    let name=f.name.replace(/[\\/:*?"<>|]+/g,' ').trim()||'documento';const ext=f.type==='img'?(data.indexOf('image/png')>0?'.png':'.jpg'):'.pdf';if(!name.toLowerCase().endsWith(ext))name+=ext;
    saveFile(name,dataURLtoBlob(data));},
  delfile:async d=>{const s=findSub(V.aid,V.sid);s.files=s.files.filter(x=>x.id!==d.f);await fdel(d.f);save();close();render();toast('Eliminato');},
  export:async()=>{const files={};for(const a of S.areas)for(const s of a.subs)for(const f of s.files){const x=await fget(f.id);if(x)files[f.id]=x;}
    saveFile('memovita-backup-'+today()+'.json',JSON.stringify({app:'memovita',v:1,state:S,files}));},
  privacy:()=>sheet('Privacy, in parole semplici',
    '<h3 class="ph">Dove sono i tuoi dati</h3><p class="para">Tutto quello che inserisci (riquadri, scadenze, note, foto e PDF) resta <b>solo su questo telefono</b>, nella memoria del browser. Non viene inviato a nessun server.</p>'+
    '<h3 class="ph">Chi li può vedere</h3><p class="para">Solo tu. Nessun altro, nemmeno chi ha creato Memovita, può leggere i tuoi dati.</p>'+
    '<h3 class="ph">Cosa non facciamo</h3><p class="para">Niente pubblicità, niente vendita di dati, niente profilazione. Non ti chiediamo nome, email o numero di telefono.</p>'+
    '<h3 class="ph">Cosa raccogliamo</h3><p class="para">Nulla. In questa versione di prova non ci sono statistiche di utilizzo né tracciamenti.</p>'+
    '<h3 class="ph">Se cambi telefono o cancelli il browser</h3><p class="para">I dati si perdono, perché esistono solo qui. Esporta ogni tanto un backup dal Profilo e conservalo dove preferisci.</p>'+
    '<h3 class="ph">Cancellare tutto</h3><p class="para">Dal Profilo, "Cancella tutti i dati" elimina ogni cosa da questo telefono in modo definitivo.</p>'+
    '<h3 class="ph">Nelle prossime versioni</h3><p class="para">Accesso con email, condivisione in famiglia e scansione IA richiederanno di salvare alcuni dati in modo protetto (server in Europa, cifratura, regole GDPR). Te lo chiederemo sempre prima, e potrai dire di no.</p>'+
    '<p class="para muted">Versione di prova: non inserire documenti che non vuoi tenere sul telefono.</p>'),
  intro:()=>{S.onboarded=false;onbStep=0;showOnboarding();},
  onbnext:()=>{if(onbStep<ONB.length-1){onbStep++;renderOnb();}else endOnb();},
  onbskip:()=>endOnb(),
  wipe:()=>sheet('Cancellare tutti i dati?','<p class="para">Riquadri, scadenze, note e documenti vengono eliminati da questo telefono. Non si può annullare.</p><button class="primary" style="background:var(--bell);color:#fff" data-act="wipe2">Cancella tutto</button><button class="ghost" data-act="close">Annulla</button>'),
  wipe2:async()=>{for(const a of S.areas)for(const s of a.subs)for(const f of s.files)await fdel(f.id);S={areas:defaultAreas(),onboarded:true,settings:{rems:DEF_REMS.slice()},lists:defaultLists(),todos:[]};shopSel=null;save();close();tab('home');toast('Dati cancellati');}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t,e);}});
document.addEventListener('submit',e=>{if(e.target.id==='addtodo'){e.preventDefault();const inp=document.getElementById('newtodo');if(addTodo(inp.value)){const n=document.getElementById('newtodo');if(n)n.focus();}return;}if(e.target.id==='additem'){e.preventDefault();const inp=document.getElementById('newitem');const v=inp.value;if(addItem(v)){const n=document.getElementById('newitem');if(n)n.focus();}}});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='frep'){const w=t.value==='settimanale';const f=document.getElementById('fdays');if(f)f.hidden=!w;const g=document.getElementById('fdatefld');if(g)g.hidden=w;return;}
  const kind=t.dataset&&t.dataset.upload;if(!kind||!t.files||!t.files.length)return;
  const files=Array.from(t.files);const file=files[0];t.value='';
  if(kind==='backup'){
    try{const txt=await file.text();const o=JSON.parse(txt);if(!o||o.app!=='memovita'||!o.state||!Array.isArray(o.state.areas))throw 0;
      sheet('Ripristinare il backup?','<p class="para">I dati attuali su questo telefono vengono sostituiti da quelli del file.</p><button class="primary" id="doimp">Ripristina</button><button class="ghost" data-act="close">Annulla</button>');
      document.getElementById('doimp').addEventListener('click',async()=>{for(const id in (o.files||{}))await fput(id,o.files[id]);S=o.state;S.onboarded=true;if(!Array.isArray(S.todos))S.todos=[];if(!Array.isArray(S.lists)||!S.lists.length)S.lists=defaultLists();shopSel=null;if(!S.settings)S.settings={};if(!Array.isArray(S.settings.rems))S.settings.rems=DEF_REMS.slice();save();close();tab('home');toast('Backup ripristinato');});
    }catch(err){toast('Questo file non è un backup di Memovita');}
    return;
  }
  const s=findSub(V.aid,V.sid);if(!s)return;
  const ok=files.filter(f=>kind==='pdf'?(!f.type||f.type==='application/pdf'):(!f.type||f.type.indexOf('image/')===0));
  if(!ok.length){toast(kind==='pdf'?'Scegli un file PDF':'Scegli una foto o uno screenshot');return;}
  toast('Salvataggio in corso...');
  let added=0;
  for(const f of ok){
    try{let data=await readAsDataURL(f);if(kind==='img')data=await shrinkImage(data);
      const id=uid();await fput(id,data);
      const base=(f.name||'').replace(/\.[^.]+$/,'');
      s.files.push({id,type:kind,name:base||(kind==='img'?'Foto '+fmtShort(today()):'Documento'),date:today()});added++;
    }catch(err){}
  }
  save();render();
  if(!added)toast('Non riesco a leggere il file. Riprova');
  else toast(kind==='img'?(added===1?'Foto aggiunta':added+' foto aggiunte'):(added===1?'PDF aggiunto':added+' PDF aggiunti'));
});
async function loadThumbs(){const els=document.querySelectorAll('img[data-thumb]');for(const el of els){const d=await fget(el.dataset.thumb);if(d)el.src=d;}}

render();
setInterval(()=>{if(!layer.innerHTML&&V.name!=='search'&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render();},60000);

# Publishes portfolio/ to the gh-pages branch, which GitHub Pages serves at
# https://veronicaturcanvt-blip.github.io/canale-youtube/
name: Publish portfolio

on:
  push:
    branches:
      - claude/gifted-darwin-ui1rxp   # branch where the site is edited
      - claude/amazing-hawking-5l70ib # default branch, if the site is merged there
    paths:
      - 'portfolio/**'
      - '.github/workflows/publish-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-portfolio
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          path: src

      - name: Check out gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: Copy portfolio into gh-pages
        run: |
          rsync -a --delete --exclude '.git' --exclude 'README.md' src/portfolio/ site/
          touch site/.nojekyll

      - name: Commit and push if changed
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Site is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish portfolio from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push origin gh-pages
